name: Test and deploy MiniStar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ministar-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install terrain image tools
        run: python3 -m pip install Pillow==12.0.0 numpy==2.3.5
      - name: Restore and verify original resources
        run: npm run build
      - name: Verify generated building catalog documentation
        run: npm run docs:buildings:check
      - name: Verify complete original animation assets
        run: npm run audit:animations
      - name: Test simulation, static server and resource paths
        run: npm test
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile UI and legacy cache migration under /ministar/
        run: |
          node tests/browser.cjs
          node tests/projectile-browser.cjs
          node tests/movement-animation-browser.cjs
          node tests/original-animation-browser.cjs
          node tests/spell-effects-browser.cjs
          node tests/performance-browser.cjs
          node tests/resource-cache-browser.cjs
          node tests/inspection-browser.cjs
          node tests/elapsed-time-browser.cjs
      - name: Upload browser visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-evidence
          path: |
            /tmp/ministar-original-animations.png
            /tmp/ministar-original-deaths.png
            /tmp/ministar-spell-effects-mobile.png
            /tmp/ministar-upright-terrain.png
            /tmp/ministar-performance-mobile.png
            /tmp/ministar-health-bar-174.png
            /tmp/ministar-health-bar-142.png
            /tmp/ministar-browser-performance.json
            /tmp/ministar-resource-cache.json
            /tmp/ministar-inspection-panel-mobile.png
            /tmp/ministar-construction-console-mobile.png
            /tmp/ministar-build-target-mobile.png
            /tmp/ministar-elapsed-time-mobile.png
            /tmp/ministar-health-bar-zoom-04.png
            /tmp/ministar-health-bar-zoom-14.png
            /tmp/ministar-mana-bar.png
            /tmp/ministar-addon-connections.png
            /tmp/ministar-cloak-level-*.png
            /tmp/ministar-cloak-video/*.webm
            /tmp/ministar-burrow-video/*.webm
            /tmp/ministar-projectile-video/*.webm
            /tmp/ministar-projectile-*.png
            /tmp/ministar-walk-*.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

